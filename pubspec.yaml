name: cangkang_sawit_mobile
description: "Aplikasi mobile untuk Cangkang Sawit - Modern Palm Shell Trading Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Firebase (optional - for FCM notifications)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Communication
  url_launcher: ^6.2.2
  flutter_inappwebview: ^6.0.0

  # Animations
  lottie: ^3.0.0
  file_picker: ^10.3.8


  # Optional - Maps (uncomment if needed)
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
