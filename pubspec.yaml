name: cangkang_sawit_mobile
description: "Aplikasi mobile untuk Cangkang Sawit - Modern Palm Shell Trading Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.69.0

  # Communication
  url_launcher: ^6.2.2
  flutter_inappwebview: ^6.0.0

  # Animations
  lottie: ^3.0.0
  file_picker: ^10.3.8

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.1.0
  permission_handler: ^12.0.1

  # UI Components for Delivery Tracking
  sliding_up_panel: ^2.0.0+1

  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
